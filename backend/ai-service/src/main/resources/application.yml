server:
  port: 9006
  servlet:
    context-path: /api/ai

spring:
  application:
    name: ai-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        file-extension: yaml
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8858}
      eager: true
  config:
    import:
      - optional:nacos:ai-service.yaml

  jackson:
    generator:
      write-numbers-as-strings: true

  # Redis配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0

# Feign 配置
feign:
  sentinel:
    enabled: true

# DeepSeek AI 配置
deepseek:
  api-key: ${DEEPSEEK_API_KEY:sk-e84f9f6514ed4ebbb2db70dae7d87004}
  base-url: https://api.deepseek.com
  model: deepseek-chat
  max-tokens: 2000
  temperature: 0.7

# 内部服务调用地址
service:
  course-url: ${COURSE_SERVICE_URL:http://localhost:8082}
  learning-url: ${LEARNING_SERVICE_URL:http://localhost:9004}

# 推荐配置
recommend:
  cache-ttl-minutes: 30
  default-count: 5
  max-count: 10

# Knife4j配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

knife4j:
  enable: true
  setting:
    language: zh_cn

# 日志配置
logging:
  level:
    com.taotao.education: DEBUG

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

