server:
  port: 9000

spring:
  application:
    name: gateway-service
  
  cloud:
    gateway:
      routes:
        # 用户服务路由
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=0
        
        # 课程服务路由
        - id: course-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/course/**
          filters:
            - StripPrefix=0
        
        # 订单服务路由
        - id: order-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/order/**
          filters:
            - StripPrefix=0
      
      # 全局超时配置
      httpclient:
        connect-timeout: 5000
        response-timeout: 30000
  
  # Redis配置
  data:
    redis:
      host: localhost
      port: 6379
      database: 0

# 日志配置
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    com.taotao.education.gateway: DEBUG

