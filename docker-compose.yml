services:
  mysql:
    image: mysql:8.0
    container_name: taotao-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 560868042a
      MYSQL_DATABASE: taotao_education
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/sql:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p560868042a"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    container_name: taotao-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: taotao-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  nacos1:
    image: nacos/nacos-server:v2.3.2
    container_name: taotao-nacos1
    environment:
      MODE: cluster
      NACOS_SERVERS: nacos1:8848 nacos2:8848 nacos3:8848
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: nacos_config
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: 560868042a
      NACOS_AUTH_ENABLE: "false"
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy

  nacos2:
    image: nacos/nacos-server:v2.3.2
    container_name: taotao-nacos2
    environment:
      MODE: cluster
      NACOS_SERVERS: nacos1:8848 nacos2:8848 nacos3:8848
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: nacos_config
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: 560868042a
      NACOS_AUTH_ENABLE: "false"
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy

  nacos3:
    image: nacos/nacos-server:v2.3.2
    container_name: taotao-nacos3
    environment:
      MODE: cluster
      NACOS_SERVERS: nacos1:8848 nacos2:8848 nacos3:8848
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: nacos_config
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: 560868042a
      NACOS_AUTH_ENABLE: "false"
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy

  nacos-lb:
    image: nginx:1.27
    container_name: taotao-nacos-lb
    ports:
      - "8848:8848"
    volumes:
      - ./deploy/nacos/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - nacos1
      - nacos2
      - nacos3

  sentinel:
    image: bladex/sentinel-dashboard:1.8.8
    container_name: taotao-sentinel
    ports:
      - "8858:8858"

  seata:
    image: apache/seata-server:2.2.0
    container_name: taotao-seata
    environment:
      SEATA_IP: seata
      SEATA_PORT: 8091
      STORE_MODE: file
    ports:
      - "8091:8091"

  gateway-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        JAR_FILE: gateway/target/gateway-1.0.0.jar
    container_name: taotao-gateway-service
    restart: unless-stopped
    environment:
      NACOS_ADDR: nacos-lb:8848
      REDIS_HOST: redis
    ports:
      - "9000:9000"
    depends_on:
      - nacos-lb
      - redis

  user-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        JAR_FILE: user-service/target/user-service-1.0.0.jar
    container_name: taotao-user-service
    restart: unless-stopped
    environment:
      NACOS_ADDR: nacos-lb:8848
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: taotao_education
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: 560868042a
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SENTINEL_DASHBOARD: sentinel:8858
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      nacos-lb:
        condition: service_started
      redis:
        condition: service_started
      sentinel:
        condition: service_started

  course-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        JAR_FILE: course-service/target/course-service-1.0.0.jar
    container_name: taotao-course-service
    restart: unless-stopped
    environment:
      NACOS_ADDR: nacos-lb:8848
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: taotao_education
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: 560868042a
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SENTINEL_DASHBOARD: sentinel:8858
      SEATA_SERVER_ADDR: seata:8091
      FILE_ACCESS_URL: http://localhost:8082/uploads
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy
      nacos-lb:
        condition: service_started
      redis:
        condition: service_started
      sentinel:
        condition: service_started
      seata:
        condition: service_started

  order-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        JAR_FILE: order-service/target/order-service-1.0.0.jar
    container_name: taotao-order-service
    restart: unless-stopped
    environment:
      NACOS_ADDR: nacos-lb:8848
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: taotao_education
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: 560868042a
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_VHOST: /
      SENTINEL_DASHBOARD: sentinel:8858
      SEATA_SERVER_ADDR: seata:8091
    ports:
      - "8083:8083"
    depends_on:
      mysql:
        condition: service_healthy
      nacos-lb:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      sentinel:
        condition: service_started
      seata:
        condition: service_started

  learning-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        JAR_FILE: learning-service/target/learning-service-1.0.0.jar
    container_name: taotao-learning-service
    restart: unless-stopped
    environment:
      NACOS_ADDR: nacos-lb:8848
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: taotao_education
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: 560868042a
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "9004:9004"
    depends_on:
      mysql:
        condition: service_healthy
      nacos-lb:
        condition: service_started
      redis:
        condition: service_started

  chat-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        JAR_FILE: chat-service/target/chat-service-1.0.0.jar
    container_name: taotao-chat-service
    restart: unless-stopped
    environment:
      NACOS_ADDR: nacos-lb:8848
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: taotao_education
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: 560868042a
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_VHOST: /
    ports:
      - "9005:9005"
    depends_on:
      mysql:
        condition: service_healthy
      nacos-lb:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started

  ai-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        JAR_FILE: ai-service/target/ai-service-1.0.0.jar
    container_name: taotao-ai-service
    restart: unless-stopped
    environment:
      NACOS_ADDR: nacos-lb:8848
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SENTINEL_DASHBOARD: sentinel:8858
      COURSE_SERVICE_URL: http://course-service:8082
      LEARNING_SERVICE_URL: http://learning-service:9004
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    ports:
      - "9006:9006"
    depends_on:
      nacos-lb:
        condition: service_started
      redis:
        condition: service_started
      sentinel:
        condition: service_started

volumes:
  mysql-data:
