services:
  nacos1:
    image: nacos/nacos-server:v2.3.2
    container_name: taotao-nacos1
    restart: unless-stopped
    environment:
      MODE: cluster
      PREFER_HOST_MODE: hostname
      NACOS_SERVERS: nacos1:8848 nacos2:8848
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: ${MYSQL_SERVICE_HOST:-host.docker.internal}
      MYSQL_SERVICE_PORT: ${MYSQL_SERVICE_PORT:-3306}
      MYSQL_SERVICE_DB_NAME: ${MYSQL_SERVICE_DB_NAME:-nacos_config}
      MYSQL_SERVICE_USER: ${MYSQL_SERVICE_USER:-root}
      MYSQL_SERVICE_PASSWORD: ${MYSQL_SERVICE_PASSWORD:-}
      NACOS_AUTH_ENABLE: ${NACOS_AUTH_ENABLE:-true}
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-serverIdentity}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-security}
      TZ: Asia/Shanghai
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    networks:
      - nacos-net

  nacos2:
    image: nacos/nacos-server:v2.3.2
    container_name: taotao-nacos2
    restart: unless-stopped
    environment:
      MODE: cluster
      PREFER_HOST_MODE: hostname
      NACOS_SERVERS: nacos1:8848 nacos2:8848
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: ${MYSQL_SERVICE_HOST:-host.docker.internal}
      MYSQL_SERVICE_PORT: ${MYSQL_SERVICE_PORT:-3306}
      MYSQL_SERVICE_DB_NAME: ${MYSQL_SERVICE_DB_NAME:-nacos_config}
      MYSQL_SERVICE_USER: ${MYSQL_SERVICE_USER:-root}
      MYSQL_SERVICE_PASSWORD: ${MYSQL_SERVICE_PASSWORD:-}
      NACOS_AUTH_ENABLE: ${NACOS_AUTH_ENABLE:-true}
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-serverIdentity}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-security}
      TZ: Asia/Shanghai
    ports:
      - "8868:8848"
      - "9858:9848"
      - "9859:9849"
    networks:
      - nacos-net

networks:
  nacos-net:
    driver: bridge
